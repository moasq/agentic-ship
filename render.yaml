# Render Blueprint — the deployment as a committed, reviewable file.
#
# This is why Render was chosen over Railway: the whole topology lives here, in the
# repo, diffable in a pull request and reproducible from a fork. Nothing about the
# running service exists only in a dashboard.
#
# Connect the repo in Render, it detects this file, you approve it. Then set the two
# secrets below (marked sync: false, so this file names them without ever holding a
# value) and deploy.
#
# Full env matrix and the go-live checklist:
#   .agents/skills/convex-structure/references/deploy-render.md

services:
  - type: web
    name: agentic-ship
    runtime: node
    plan: starter
    region: oregon
    branch: main

    # `convex deploy` pushes the backend to the PROD Convex deployment and only then
    # runs the frontend build, with NEXT_PUBLIC_CONVEX_URL injected for it. One command
    # keeps backend and frontend from ever shipping out of step — the single most
    # common way a Convex app breaks in production.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && npx convex deploy --cmd 'pnpm build'
    startCommand: pnpm start

    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Full-write credential for the prod Convex deployment. Generated in the Convex
      # dashboard (Project Settings -> Deploy Keys). Set it in Render only — it is on
      # `pnpm health`'s CRITICAL list for .env.local for exactly this reason.
      - key: CONVEX_DEPLOY_KEY
        sync: false

      # Public analytics key (phc_). Public by design; the personal key (phx_) must
      # never appear anywhere in this repo or in any host env.
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false

      - key: NEXT_PUBLIC_POSTHOG_HOST
        value: https://us.i.posthog.com

      # Canonical URL for metadata, sitemap and OG. Update to the custom domain when
      # the domain decision lands.
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: agentic-ship
          property: hostport

# Everything else — BETTER_AUTH_SECRET, SITE_URL, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_*, RESEND_API_KEY, RESEND_WEBHOOK_SECRET,
# EMAIL_FROM — belongs to the PROD CONVEX DEPLOYMENT's environment, not to Render.
# The web service never sees a backend secret. That separation is the whole point of
# running the backend in Convex, and it is what keeps live Stripe keys off every dev
# machine (rule R7).
