name: Plugin Security Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: HOL plugin scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@fc91f16ca4e6c0c919e807238f27b329dd828cbe # v1.2.571
        with:
          plugin_dir: "."
          mode: scan
          config: ".plugin-scanner.toml"
          trust_repository_policy: false
          min_score: 80
          fail_on_severity: high
          pr_comment: off
