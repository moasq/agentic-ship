name: ci

# The bundle claims to work on macOS, Linux and Windows. This is the proof: the same
# Node-only tooling (`pnpm verify`) runs on all three.
#
# Windows is the job that matters, and not because of a health check — it is the one
# platform where the cross-platform seams actually differ. A `git checkout` there cannot
# create the `.claude/skills` symlink and writes a plain text stub instead, silently; the
# postinstall link/junction repair and every script that spawns a CLI (`npx`, `pnpm`)
# must behave identically under cmd/PowerShell. If any of that is POSIX-only, it breaks
# here and nowhere else.

# Least privilege: this workflow only reads the repo. No token needs write scope.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing must not hide the state of the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the full commit SHA of the v4 tag: a tag is mutable and a supply-chain
      # foothold, a SHA is not. Move it only through upstream-sync.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Also runs postinstall: link-skills + sync-mcp + sync-agent-config.
      - run: pnpm install --frozen-lockfile

      # The offline definition of done: tool health, native agent adapters, the MCP
      # mirror, UI tooling contracts, and the unit gate (`pnpm test`) — all of it in one
      # command. `pnpm verify` already runs `pnpm test`, so there is no separate test
      # step here; adding one would run the unit gate twice per job.
      - run: pnpm verify

  # The networked, fail-closed part of `verify:full`. Kept as its own single-OS job
  # because it needs the registry (unlike `verify`, which is offline) and the audit is
  # platform-independent, so running it once is enough. There is deliberately no browser
  # (e2e) job: this tool-only repo ships no application, no Playwright config, and no
  # specs, so there is nothing for a browser gate to run.
  audit:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Audits production AND dev dependencies (every real dependency here is a dev one).
      - run: pnpm audit:supply-chain

  agentic-workflows:
    name: agentic-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned official compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.87.10
      - run: pnpm check:aw
      - run: pnpm test:aw
