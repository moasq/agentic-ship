name: ci

# The bundle claims to work on macOS, Linux and Windows. This is the proof.
#
# Windows is the job that matters. A `git checkout` there cannot create the
# `.claude/skills` symlink and writes a plain text file containing the path instead —
# silently. If `postinstall` did not repair that with a directory junction, the
# `.claude/skills resolves` check in `pnpm health` fails here and nowhere else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing must not hide the state of the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Also runs postinstall: link-skills + sync-mcp.
      - run: pnpm install --frozen-lockfile

      # Offline definition of done: health, native agent adapters, the MCP mirror,
      # component contracts, lint, and a production build. Convex is deliberately
      # unconnected in CI and reports a non-blocking stage warning.
      - run: pnpm verify

      # Gate G2 — backend logic in memory, no network, no Convex account.
      - run: pnpm test

  # Full release proof. This job was disabled for a while: Playwright's
  # webServer runs `pnpm build`, `next/font/google` fetched IBM Plex at BUILD time, and
  # the runner has no route to fonts.googleapis.com, so the build died inside webServer
  # while the plain `pnpm build` step above stayed green. The fix was to stop needing
  # the network at all — the OFL files are committed under src/fonts/ofl/ and load via
  # next/font/local. `pnpm health` now WARNs if anything reintroduces next/font/google.
  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      # Adds the fail-closed production dependency audit and every unit/browser gate.
      - run: pnpm verify:full
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
