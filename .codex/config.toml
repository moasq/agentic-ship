# Generated by scripts/sync-agent-config.mjs from .mcp.json and .agents/agents/.
# Trust this project before Codex loads project-scoped MCP servers.
[agents]
max_concurrent_threads_per_session = 4

# Source server: shadcn
[mcp_servers.workspace-shadcn]
command = "npx"
args = ["-y", "shadcn@4.16.1", "mcp"]

# Source server: next-devtools
[mcp_servers.workspace-next-devtools]
command = "npx"
args = ["-y", "next-devtools-mcp@0.4.0"]

# Source server: magicui
[mcp_servers.workspace-magicui]
command = "npx"
args = ["-y", "@magicuidesign/mcp@2.0.0"]

# Source server: 21st
[mcp_servers.workspace-21st]
url = "https://21st.dev/api/mcp"

# Source server: context7
[mcp_servers.workspace-context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@3.2.5"]

# Source server: convex
[mcp_servers.workspace-convex]
command = "npx"
args = ["-y", "convex@1.43.0", "mcp", "start"]

# Source server: stripe
[mcp_servers.workspace-stripe]
url = "https://mcp.stripe.com"

# Source server: resend
[mcp_servers.workspace-resend]
url = "https://mcp.resend.com/mcp"

# Source server: posthog
[mcp_servers.workspace-posthog]
url = "https://mcp.posthog.com/mcp"

# Source server: linear
[mcp_servers.workspace-linear]
url = "https://mcp.linear.app/mcp"

# Source server: playwright-test
[mcp_servers.workspace-playwright-test]
command = "npx"
args = ["-y", "playwright@1.62.1", "run-test-mcp-server"]
